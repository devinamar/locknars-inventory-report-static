<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D2 Report</title>
    <!-- The report's fonts, as the CLI's report loads them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;800&display=swap"
    />
    <!-- The boot log, and over a report the refresh widget it moves into
         (src/refresh.ts), in the report's colours: ↻, the status and the log's
         toggle in the corner, the log opening above them. -->
    <style>
      #boot { max-width: 55rem; margin: 3.75rem auto; padding: 0 1.25rem; }
      .boot-log { list-style: none; padding: 0; font: 16.25px/1.7 'JetBrains Mono', monospace; }
      .refresh {
        position: fixed; right: 16px; bottom: 16px; z-index: 1000;
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
        max-width: min(35rem, calc(100vw - 32px)); padding: 8px 10px;
        border: 1px solid var(--keep-line); border-radius: 12.5px; background: var(--card);
        box-shadow: 0 7.5px 22.5px #000a; font: 15px/1.35 var(--mono); overflow-wrap: anywhere;
      }
      .refresh-status { flex: 1 1 12rem; margin: 0; }
      .refresh .act { min-height: 40px; padding: 0 12px; font-size: 15px; }
      .refresh .act:focus-visible { outline: 2.5px solid var(--keep); outline-offset: 2.5px; }
      .refresh .act span { display: inline-block; }
      .refresh-now span { font-size: 20px; line-height: 1; }
      .refresh-now[aria-disabled="true"] { cursor: progress; }
      .refresh.busy .refresh-now span { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(1turn); } }
      @media (prefers-reduced-motion: reduce) { .refresh.busy .refresh-now span { animation: none; } }
      .refresh-log[aria-expanded="true"] span { transform: rotate(180deg); }
      .refresh .boot-log { order: -1; flex: 1 0 100%; max-height: 40vh; overflow: auto; margin: 0; font-size: 13.75px; }
      /* The Preferences tab's bar stays clear of the widget. */
      body:has(> .refresh) .pref-bar { bottom: 90px; }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main id="boot">
      <h1>D2 Report</h1>
      <ol class="boot-log" id="log"></ol>
      <button id="login" hidden>Log in with Bungie</button>
    </main>
  </body>
</html>
