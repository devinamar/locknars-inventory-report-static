# Test, build and deploy the site to Cloudflare on every push to main, and
# every 6 hours for its data: a new manifest, wishlist updates, and the perk
# scores published on Mondays.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      # The live Bungie app's credentials go into the page: its key only
      # works from the site's address, and Bungie sends logins only there.
      # So does DIM's API key, registered for that address; without the
      # secret, DIM's tags and notes are skipped. The commit keys the
      # reports players' browsers keep: new code rebuilds them once, and the
      # scheduled runs, which build the same commit, don't.
      - run: npm run build
        env:
          VITE_COMMIT: ${{ github.sha }}
          VITE_BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
          VITE_BUNGIE_CLIENT_ID: ${{ secrets.BUNGIE_CLIENT_ID }}
          VITE_BUNGIE_CLIENT_SECRET: ${{ secrets.BUNGIE_CLIENT_SECRET }}
          VITE_DIM_API_KEY: ${{ secrets.DIM_API_KEY }}
      - run: node build/data.ts dist
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.154.0
